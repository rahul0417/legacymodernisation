[project]
name = "shorty"
version = "0.1.0"
description = "MWU-SHORTY-001 — Python rewrite of mikecao/shorty (FastAPI + PostgreSQL)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.0",
    "sqlalchemy[asyncio]==2.0.27",
    "asyncpg==0.29.0",
    "aiosqlite==0.19.0",
    "pydantic==2.6.0",
    "pydantic-settings==2.1.0",
    "alembic==1.13.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "hypothesis==6.98.0",
    "httpx==0.26.0",
    "testcontainers[postgresql]==3.7.1",
]
dev = [
    "ruff==0.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

# ── Pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "requires_pg: test requires a real Postgres backend (testcontainers-postgresql)",
    "parity: dual-run parity test — needs PHP reference container",
]

# ── Ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
]
ignore = [
    "E501",  # line-length enforced via formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "UP"]
